name: TestFlight (Nagram)

# Signed release_arm64 build. A push to release publishes it, a manual run
# publishes only when requested. A push to main is a test of the same build:
# nothing is published, the run keeps the IPA, without its signature, as the
# artifact Nagram-unsigned-<build number> and posts it to the assets channel
# with the commits of the push.
# Runs on GitHub-hosted xcode-27 (Apple Silicon, macOS 27, iOS 27 SDK).
#
# Required repository secrets:
#   TELEGRAM_API_ID, TELEGRAM_API_HASH  - Telegram API credentials (my.telegram.org)
#   APPLE_TEAM_ID                       - signing team (Kitta Ltd = 7P8CLHDH5G)
#   ASC_KEY_ID, ASC_ISSUER_ID           - App Store Connect API key id + issuer
#   ASC_KEY_P8_BASE64                   - base64 of AuthKey_<ASC_KEY_ID>.p8
#   DIST_CERT_P12_BASE64                - base64 of the Apple Distribution (Kitta) cert+key .p12
#   DIST_CERT_PASSWORD                  - password for that .p12
#
# A build that goes to TestFlight is also published as the GitHub release
# v<app version>-<build number> and posted to the Telegram channels, with the
# notes in docs/nagram/releases/<app version>.md. The post needs the secret
# NAGRAM_CHANNEL_BOT_TOKEN and the variables NAGRAM_CHANNEL_ASSETS_CHAT_ID
# (gets the files), NAGRAM_CHANNEL_CHAT_ID (gets a copy of the post); nothing
# is posted while they are missing. Its Bot API server runs with
# TELEGRAM_API_ID and TELEGRAM_API_HASH, which the build needs anyway. The variable
# NAGRAM_TESTFLIGHT_URL, the public TestFlight link, adds a button to the post.
#
# Make the cert .p12:  security export is not enough — export from Keychain Access
# (Apple Distribution: Kitta Ltd, "Export... .p12"), then: base64 -i dist.p12 | pbcopy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight and distribute to the configured group
        type: boolean
        default: false
  push:
    branches: [ "release", "main" ]

concurrency:
  group: testflight-${{ github.ref }}
  # A newer push to main replaces the test of the older one; a release is never cancelled.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-upload:
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      version: ${{ steps.channel.outputs.version }}
      build: ${{ steps.channel.outputs.build }}
      min_os: ${{ steps.channel.outputs.min_os }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # --- from envvars (repository secrets) ---
      TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
      # --- app identity (not secret) ---
      BUNDLE_ID:   xyz.nextalone.nagram
      APPSTORE_ID: "6781000861"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The channel post of a release needs its notes; a release without them
      # stops here instead of after the build.
      - name: Check the release notes
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          if [ "$PUBLISH" != "true" ]; then
            exit 0
          fi
          NOTES="docs/nagram/releases/$APP_VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing, write the notes of $APP_VERSION before releasing it."
            exit 1
          fi
        env:
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish }}

      - name: Select pinned Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}')" = "$XCODE_VERSION"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "build=$(xcodebuild -version | awk '/^Build version / {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Install Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Import distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD:   ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPWD="$(uuidgen)"
          security create-keychain -p "$KPWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPWD" "$KEYCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KPWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Set up App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Fetch next App Store Connect build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(python3 - <<'PY'
          import base64, json, os, sys, time, urllib.error, urllib.request
          from cryptography.hazmat.primitives.asymmetric.ec import ECDSA
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from cryptography.hazmat.primitives.hashes import SHA256
          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          kid = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          app_id = os.environ["APPSTORE_ID"]
          key_path = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8"
          )
          key = load_pem_private_key(open(key_path, "rb").read(), password=None)

          def token():
              header = base64.urlsafe_b64encode(
                  json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode()
              ).rstrip(b"=")
              now = int(time.time())
              payload = base64.urlsafe_b64encode(
                  json.dumps({
                      "iss": issuer,
                      "iat": now,
                      "exp": now + 600,
                      "aud": "appstoreconnect-v1",
                  }).encode()
              ).rstrip(b"=")
              message = header + b"." + payload
              signature = key.sign(message, ECDSA(SHA256()))
              r, s = decode_dss_signature(signature)
              raw_signature = r.to_bytes(32, "big") + s.to_bytes(32, "big")
              return (
                  message
                  + b"."
                  + base64.urlsafe_b64encode(raw_signature).rstrip(b"=")
              ).decode()

          def fetch(path):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": f"Bearer {token()}"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  details = error.read().decode(errors="replace")
                  print(
                      f"ERROR: App Store Connect returned {error.code}: {details}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          # A processing upload does not have a /v1/builds resource yet. Read
          # buildUploads as well so its CFBundleVersion cannot be reused.
          uploads = fetch(
              f"/v1/apps/{app_id}/buildUploads"
              "?fields[buildUploads]=cfBundleVersion,state,uploadedDate&limit=200"
          ).get("data", [])
          builds = fetch(
              "/v1/builds"
              f"?filter[app]={app_id}&sort=-uploadedDate&limit=200"
          ).get("data", [])

          candidates = []
          for upload in uploads:
              attributes = upload.get("attributes", {})
              version = str(attributes.get("cfBundleVersion", ""))
              state = attributes.get("state", {}).get("state", "UNKNOWN")
              if version.isdigit():
                  candidates.append((int(version), f"upload {state}"))
          for build in builds:
              attributes = build.get("attributes", {})
              version = str(attributes.get("version", ""))
              if version.isdigit():
                  candidates.append((
                      int(version),
                      f"build {attributes.get('processingState', 'UNKNOWN')}",
                  ))

          if not candidates:
              print(
                  "ERROR: App Store Connect returned no numeric build or upload versions",
                  file=sys.stderr,
              )
              sys.exit(1)

          latest, state = max(candidates)
          print(
              f"Latest App Store Connect version: {latest} ({state}); "
              f"next build: {latest + 1}",
              file=sys.stderr,
          )
          print(latest + 1)
          PY
          )"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Write build configuration
        run: |
          set -euo pipefail
          : "${TELEGRAM_API_ID:?missing}" "${TELEGRAM_API_HASH:?missing}" "${APPLE_TEAM_ID:?missing}"
          mkdir -p build-input
          cat > build-input/local-configuration.json <<JSON
          {
              "bundle_id": "${BUNDLE_ID}",
              "api_id": "${TELEGRAM_API_ID}",
              "api_hash": "${TELEGRAM_API_HASH}",
              "team_id": "${APPLE_TEAM_ID}",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "true",
              "appstore_id": "${APPSTORE_ID}",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": false,
              "enable_icloud": true
          }
          JSON

      - name: Write local.bazelrc (app + extensions + Xcode 27 compatibility)
        run: |
          cat > local.bazelrc <<'RC'
          build --features=no_include_scanning
          build --host_features=no_include_scanning
          build --copt=-Wno-error
          build --cxxopt=-Wno-error
          build --objccopt=-Wno-error
          build --per_file_copt=.*\.m$@-Wno-error=deprecated-declarations
          build --per_file_copt=.*\.mm$@-Wno-error=deprecated-declarations
          build --@build_bazel_rules_swift//swift:copt=-no-warnings-as-errors
          RC

      - name: Generate App Store provisioning profiles
        env:
          TEST_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          kid = os.environ["ASC_KEY_ID"]
          p = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")
          json.dump({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": open(p).read(), "in_house": False}, open("/tmp/asc_key.json", "w"))
          PY
          chmod 600 /tmp/asc_key.json
          mkdir -p build-input/codesigning/profiles

          # A test build of main takes the profiles as they are: renewing them
          # on every push could replace a profile under a release that is building.
          FORCE="--force"
          if [ "$TEST_BUILD" = "true" ]; then
            FORCE=""
          fi
          while IFS=: read -r suffix filename; do
            identifier="${BUNDLE_ID}${suffix}"
            # shellcheck disable=SC2086
            fastlane sigh --api_key_path /tmp/asc_key.json --app_identifier "$identifier" \
              --platform ios $FORCE \
              --output_path build-input/codesigning/profiles --filename "$filename"
          done <<'PROFILES'
          :Telegram.mobileprovision
          .Share:Share.mobileprovision
          .NotificationContent:NotificationContent.mobileprovision
          .NotificationService:NotificationService.mobileprovision
          .SiriIntents:Intents.mobileprovision
          .Widget:Widget.mobileprovision
          .BroadcastUpload:BroadcastUpload.mobileprovision
          PROFILES
          rm -f /tmp/asc_key.json

      - name: Force iOS 15 deployment target
        run: |
          sed -i '' 's/minimum_os_version = "[^"]*"/minimum_os_version = "15.0"/g' Telegram/BUILD

      - name: Build (release_arm64, signed)
        run: |
          set -euo pipefail
          : "${BUILD_NUMBER:?missing}"
          echo "Build number: $BUILD_NUMBER"
          python3 build-system/Make/Make.py \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-input/local-configuration.json \
            --codesigningInformationPath build-input/codesigning \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath build/artifacts

      # Uploaded before the TestFlight step so the IPA and dSYMs survive an upload failure.
      - name: Upload IPA and dSYMs
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-${{ env.BUILD_NUMBER }}
          path: |
            build/artifacts/Telegram.ipa
            build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error

      - name: Save signed IPA
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-${{ env.BUILD_NUMBER }}-Xcode-27
          path: bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish
        env:
          USES_NON_EXEMPT_ENCRYPTION: ${{ vars.USES_NON_EXEMPT_ENCRYPTION || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          kid = os.environ["ASC_KEY_ID"]
          p = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")
          json.dump({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": open(p).read(), "in_house": False}, open("/tmp/asc_key.json", "w"))
          PY
          chmod 600 /tmp/asc_key.json
          # Upload only — do not distribute yet. Separating upload from distribution
          # avoids BETA_CONTRACT_MISSING aborting the upload when the Beta Testing
          # Agreement hasn't been accepted yet, or when the group is mis-configured.
          fastlane pilot upload \
            --api_key_path /tmp/asc_key.json \
            --ipa bazel-bin/Telegram/Telegram.ipa \
            --app_identifier "$BUNDLE_ID" \
            --skip_submission true \
            --skip_waiting_for_build_processing true \
            --uses_non_exempt_encryption "$USES_NON_EXEMPT_ENCRYPTION"
          rm -f /tmp/asc_key.json

      # The IPA is handed on without the App Store signature, which is of no
      # use outside TestFlight: whoever installs it signs it anew. A release
      # posts it to the channel, a test of main keeps it as an artifact.
      - name: Remove the signature
        id: channel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/channel"
          MIN_OS="$(scripts/ci-unsigned-ipa.sh bazel-bin/Telegram/Telegram.ipa \
            "$RUNNER_TEMP/channel/Nagram-$APP_VERSION-$BUILD_NUMBER.ipa")"
          ls -l "$RUNNER_TEMP/channel"
          # The dSYMs go to the GitHub release only, so they are kept apart
          # from the directory that is posted to the channel.
          mkdir -p "$RUNNER_TEMP/dsyms"
          cp build/artifacts/Telegram.DSYMs.zip \
            "$RUNNER_TEMP/dsyms/Nagram-$APP_VERSION-$BUILD_NUMBER.DSYMs.zip"
          {
            echo "version=$APP_VERSION"
            echo "build=$BUILD_NUMBER"
            echo "min_os=$MIN_OS"
          } >> "$GITHUB_OUTPUT"

      - name: Save the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-unsigned-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/channel/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save the dSYMs for the release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-dsyms-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/dsyms/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Distribute to external TestFlight group
        if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish
        env:
          # Repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
          #   TESTFLIGHT_GROUPS  - optional name of the EXTERNAL group in App Store Connect
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          APPSTORE_ID: "6781000861"
        run: |
          set -euo pipefail
          if [ -z "${TESTFLIGHT_GROUPS:-}" ]; then
            echo "TESTFLIGHT_GROUPS is not set; skipping external TestFlight group distribution."
            exit 0
          fi
          # Use the ASC REST API to find the processed build and add it to the external
          # group — avoids re-uploading the IPA and decouples distribution from upload,
          # so BETA_CONTRACT_MISSING or group misconfig cannot abort the upload step.
          python3 - <<'PY'
          import os, sys, time, json, base64, urllib.request, urllib.error
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric.ec import ECDSA
          from cryptography.hazmat.primitives.hashes import SHA256
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          kid    = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          app_id = os.environ["APPSTORE_ID"]
          group_name = os.environ["TESTFLIGHT_GROUPS"]
          build_number = os.environ["BUILD_NUMBER"]
          key = load_pem_private_key(
              open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")).read().encode(),
              password=None)

          def tok():
              hdr = base64.urlsafe_b64encode(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"}).encode()).rstrip(b"=")
              now = int(time.time())
              pay = base64.urlsafe_b64encode(json.dumps({"iss":issuer,"iat":now,"exp":now+600,"aud":"appstoreconnect-v1"}).encode()).rstrip(b"=")
              msg = hdr + b"." + pay
              sig = key.sign(msg, ECDSA(SHA256()))
              r, s = decode_dss_signature(sig)
              return (msg + b"." + base64.urlsafe_b64encode(r.to_bytes(32,"big")+s.to_bytes(32,"big")).rstrip(b"=")).decode()

          def api(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                    method=method, headers={"Authorization": f"Bearer {tok()}", "Content-Type": "application/json"})
              if body: req.data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req) as r: return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e: return e.code, {"_body": e.read().decode()}

          # 1. Find the build (wait up to 30 min for processing)
          build_id = None
          for attempt in range(36):
              s, r = api("GET", f"/v1/builds?filter[app]={app_id}&filter[version]={build_number}"
                                "&filter[processingState]=VALID&sort=-uploadedDate&limit=1")
              data = r.get("data", [])
              if data:
                  build_id = data[0]["id"]
                  print(f"Build found: {build_id} (build {build_number})")
                  break
              print(f"Waiting for build {build_number} to finish processing ({attempt+1}/36)...")
              time.sleep(50)
          if not build_id:
              print("ERROR: build not found after 30 minutes", file=sys.stderr); sys.exit(1)

          # 2. Find the external beta group by name
          s, r = api("GET", f"/v1/apps/{app_id}/betaGroups?filter[isInternalGroup]=false")
          groups = [g for g in r.get("data", []) if g["attributes"]["name"] == group_name]
          if not groups:
              available = ", ".join(g["attributes"]["name"] for g in r.get("data", []))
              print(f"WARNING: external group '{group_name}' not found; uploaded build remains in TestFlight.", file=sys.stderr)
              if available:
                  print(f"Available external groups: {available}", file=sys.stderr)
              sys.exit(0)
          group_id = groups[0]["id"]
          print(f"Group: {group_name} ({group_id})")

          # 3. Add build to group (triggers Beta App Review + notifies testers)
          s, r = api("POST", f"/v1/betaGroups/{group_id}/relationships/builds",
                     {"data": [{"type": "builds", "id": build_id}]})
          if s in (200, 201, 204, 409):
              print(f"Distributed build {build_id} to group '{group_name}' (status {s})")
          else:
              print(f"ERROR distributing: {s} {r.get('_body','')}", file=sys.stderr); sys.exit(1)
          PY

  release:
    name: GitHub Release
    needs: build-upload
    if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-upload.outputs.version }}
      BUILD: ${{ needs.build-upload.outputs.build }}

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/nagram/releases

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: Nagram-unsigned-${{ env.BUILD }}
          path: ${{ runner.temp }}/release

      - name: Download the dSYMs
        uses: actions/download-artifact@v4
        with:
          name: Nagram-dsyms-${{ env.BUILD }}
          path: ${{ runner.temp }}/release

      - name: Publish
        run: |
          set -euo pipefail
          TAG="v$VERSION-$BUILD"
          IPA="$RUNNER_TEMP/release/Nagram-$VERSION-$BUILD.ipa"
          DSYMS="$RUNNER_TEMP/release/Nagram-$VERSION-$BUILD.DSYMs.zip"
          test -f "$IPA"
          test -f "$DSYMS"
          NOTES="docs/nagram/releases/$VERSION.md"
          test -f "$NOTES"
          # A run that is started again finds its release and replaces the files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$DSYMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPA" "$DSYMS" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nagram iOS $VERSION ($BUILD)" \
              --notes-file "$NOTES"
          fi

  # The Bot API server of the action runs on ubuntu-24.04 only, so the IPA
  # comes here as an artifact of the macOS job.
  channel:
    name: Channel
    needs: [build-upload, release]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
      ASSETS_CHAT_ID: ${{ vars.NAGRAM_CHANNEL_ASSETS_CHAT_ID }}
      OFFICIAL_CHAT_ID: ${{ vars.NAGRAM_CHANNEL_CHAT_ID }}
      TESTFLIGHT_URL: ${{ vars.NAGRAM_TESTFLIGHT_URL }}
      VERSION: ${{ needs.build-upload.outputs.version }}
      BUILD: ${{ needs.build-upload.outputs.build }}

    steps:
      - name: Check the configuration
        id: configuration
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ASSETS_CHAT_ID$OFFICIAL_CHAT_ID" ]; then
            echo "::notice::NAGRAM_CHANNEL_BOT_TOKEN or both channels are not set, nothing is posted."
            exit 0
          fi
          # The files are sent to the assets channel and the official one
          # gets a copy of the post; with one channel set, it gets the post.
          CHAT_ID="${ASSETS_CHAT_ID:-$OFFICIAL_CHAT_ID}"
          COPY_TO=""
          if [ -n "$ASSETS_CHAT_ID" ] && [ "$OFFICIAL_CHAT_ID" != "$ASSETS_CHAT_ID" ]; then
            COPY_TO="$OFFICIAL_CHAT_ID"
          fi
          {
            echo "chat=$CHAT_ID"
            echo "copy=$COPY_TO"
          } >> "$GITHUB_OUTPUT"

      - name: Clone
        if: steps.configuration.outputs.chat != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/nagram/releases

      - name: Download the IPA
        if: steps.configuration.outputs.chat != ''
        uses: actions/download-artifact@v4
        with:
          name: Nagram-unsigned-${{ env.BUILD }}
          path: ${{ runner.temp }}/channel

      - name: Describe the post
        id: post
        if: steps.configuration.outputs.chat != ''
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/channel"
          test -f "$RUNNER_TEMP/channel/Nagram-$VERSION-$BUILD.ipa"
          NOTES="docs/nagram/releases/$VERSION.md"
          test -f "$NOTES"
          # English notes are optional and are folded under the others.
          NOTES_EN="docs/nagram/releases/$VERSION.en.md"
          if [ ! -f "$NOTES_EN" ]; then
            NOTES_EN=""
          fi
          {
            echo "notes=$NOTES"
            echo "notes_en=$NOTES_EN"
            echo "buttons<<BUTTONS"
            RELEASE="GitHub Release=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION-$BUILD"
            if [ -n "$TESTFLIGHT_URL" ]; then
              echo "*TestFlight=$TESTFLIGHT_URL | $RELEASE"
            else
              echo "*$RELEASE"
            fi
            echo "问题反馈=https://t.me/OrIssuesBot | Assets={post}"
            echo "BUTTONS"
          } >> "$GITHUB_OUTPUT"

      - name: Post to the channels
        if: steps.configuration.outputs.chat != ''
        uses: NextAlone/NagramActionRelated/channel-publish@2b74e4cd4e3c89fcc9d50095c039e467c674661f
        with:
          bot-token: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
          api-id: ${{ secrets.TELEGRAM_API_ID }}
          api-hash: ${{ secrets.TELEGRAM_API_HASH }}
          chat-id: ${{ steps.configuration.outputs.chat }}
          copy-to: ${{ steps.configuration.outputs.copy }}
          directory: ${{ runner.temp }}/channel
          title: Nagram iOS
          version: ${{ env.VERSION }}
          build: ${{ env.BUILD }}
          hashtags: ios release
          notes-file: ${{ steps.post.outputs.notes }}
          notes-en-file: ${{ steps.post.outputs.notes_en }}
          # The notes name these sections the same way in every release.
          fold-sections: |
            上游
            安装
          files-title: 下载
          files: |
            *.ipa | 未签名 IPA · iOS ${{ needs.build-upload.outputs.min_os }} 及以上
          buttons: ${{ steps.post.outputs.buttons }}

  # A test build of main goes to the assets channel only, with the commits of
  # the push instead of release notes.
  channel-test:
    name: Channel (test build)
    needs: build-upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
      CHAT_ID: ${{ vars.NAGRAM_CHANNEL_ASSETS_CHAT_ID }}
      VERSION: ${{ needs.build-upload.outputs.version }}
      BUILD: ${{ needs.build-upload.outputs.build }}

    steps:
      - name: Check the configuration
        id: configuration
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::notice::NAGRAM_CHANNEL_BOT_TOKEN or NAGRAM_CHANNEL_ASSETS_CHAT_ID is not set, nothing is posted to the channel."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download the IPA
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Nagram-unsigned-${{ env.BUILD }}
          path: ${{ runner.temp }}/channel

      - name: Describe the post
        id: post
        if: steps.configuration.outputs.ready == 'true'
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          # Test builds of one release share a build number, the commit tells them apart.
          COMMIT="${GITHUB_SHA::7}"
          mv "$RUNNER_TEMP/channel/Nagram-$VERSION-$BUILD.ipa" \
            "$RUNNER_TEMP/channel/Nagram-$VERSION-$BUILD-$COMMIT.ipa"
          ls -l "$RUNNER_TEMP/channel"
          # The commits of the push, shown grouped by their kind.
          printf '%s\n' "$COMMITS" > "$RUNNER_TEMP/channel-commits.json"

      - name: Post to the channel
        if: steps.configuration.outputs.ready == 'true'
        uses: NextAlone/NagramActionRelated/channel-publish@2b74e4cd4e3c89fcc9d50095c039e467c674661f
        with:
          bot-token: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
          api-id: ${{ secrets.TELEGRAM_API_ID }}
          api-hash: ${{ secrets.TELEGRAM_API_HASH }}
          chat-id: ${{ env.CHAT_ID }}
          directory: ${{ runner.temp }}/channel
          kind: test
          title: Nagram iOS
          version: ${{ env.VERSION }}
          build: ${{ env.BUILD }}
          hashtags: ios test
          commits-file: ${{ runner.temp }}/channel-commits.json
          files: |
            *.ipa | 未签名 IPA · iOS ${{ needs.build-upload.outputs.min_os }} 及以上
          buttons: Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
